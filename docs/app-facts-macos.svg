"368" y="224" font-size="12.5" font-weight="800" text-anchor="end">4 (from 2 frameworks)</text><rect x="12" y="231" width="356" height="10"/><text x="12" y="255" font-size="14" font-weight="900" text-anchor="start">Code</text><text x="368" y="255" font-size="10.5" font-weight="700" text-anchor="end">67 files</text><rect x="12" y="259" width="356" height="0.8"/><text x="12" y="272" font-size="12.5" font-weight="800" text-anchor="start">Lines of code</text><text x="368" y="272" font-size="12.5" font-weight="800" text-anchor="end">7,279</text><rect x="12" y="276" width="356" height="0.8"/><text x="26" y="289" font-size="12.5" font-weight="400" text-anchor="start">Core logic (EQCore)</text><text x="368" y="289" font-size="12.5" font-weight="400" text-anchor="end">2,060</text><rect x="12" y="293" width="356" height="0.8"/><text x="26" y="306" font-size="12.5" font-weight="400" text-anchor="start">App</text><text x="368" y="306" font-size="12.5" font-weight="400" text-anchor="end">4,338</text><rect x="12" y="310" width="356" height="0.8"/><text x="26" y="323" font-size="12.5" font-weight="400" text-anchor="start">Icon art &amp; tool</text><text x="368" y="323" font-size="12.5" font-weight="400" text-anchor="end">95</text><rect x="12" y="327" width="356" height="0.8"/><text x="26" y="340" font-size="12.5" font-weight="400" text-anchor="start">Tests</text><text x="368" y="340" font-size="12.5" font-weight="400" text-anchor="end">786</text><rect x="12" y="344" width="356" height="0.8"/><text x="12" y="357" font-size="12.5" font-weight="400" text-anchor="start">Comment lines</text><text x="368" y="357" font-size="12.5" font-weight="400" text-anchor="end">416  (5% of code)</text><rect x="12" y="361" width="356" height="0.8"/><text x="12" y="374" font-size="12.5" font-weight="400" text-anchor="start">Language</text><text x="368" y="374" font-size="12.5" font-weight="400" text-anchor="end">Swift (no Objective-C)</text><rect x="12" y="381" width="356" height="5"/><text x="12" y="400" font-size="14" font-weight="900" text-anchor="start">Tests</text><rect x="12" y="404" width="356" height="0.8"/><text x="12" y="417" font-size="12.5" font-weight="800" text-anchor="start">Tests passing</text><text x="368" y="417" font-size="12.5" font-weight="800" text-anchor="end">82/82  (100%)</text><rect x="12" y="421" width="356" height="0.8"/><text x="26" y="434" font-size="12.5" font-weight="400" text-anchor="start">Test suites</text><text x="368" y="434" font-size="12.5" font-weight="400" text-anchor="end">18</text><rect x="12" y="438" width="356" height="0.8"/><text x="26" y="451" font-size="12.5" font-weight="400" text-anchor="start">Skipped here</text><text x="368" y="451" font-size="12.5" font-weight="400" text-anchor="end">1 (needs AutoEQ index file)</text><rect x="12" y="455" width="356" height="0.8"/><text x="12" y="468" font-size="12.5" font-weight="800" text-anchor="start">Core logic line coverage</text><text x="368" y="468" font-size="12.5" font-weight="800" text-anchor="end">90.3%</text><rect x="12" y="472" width="356" height="0.8"/><text x="26" y="485" font-size="12.5" font-weight="400" text-anchor="start">Core function coverage</text><text x="368" y="485" font-size="12.5" font-weight="400" text-anchor="end">83.5%</text><rect x="12" y="489" width="356" height="0.8"/><text x="12" y="502" font-size="12.5" font-weight="400" text-anchor="start">App / UI layer</text><text x="368" y="502" font-size="12.5" font-weight="400" text-anchor="end">manually tested</text><rect x="12" y="509" width="356" height="5"/><text x="12" y="528" font-size="14" font-weight="900" text-anchor="start">Permissions &amp; Privacy</text><rect x="12" y="532" width="356" height="0.8"/><text x="12" y="545" font-size="12.5" font-weight="800" text-anchor="start">System audio recording</text><text x="368" y="545" font-size="12.5" font-weight="800" text-anchor="end">Required (process tap)</text><rect x="12" y="549" width="356" height="0.8"/><text x="12" y="562" font-size="12.5" font-weight="400" text-anchor="start">Microphone</text><text x="368" y="562" font-size="12.5" font-weight="400" text-anchor="end">Not used</text><rect x="12" y="566" width="356" height="0.8"/><text x="12" y="579" font-size="12.5" font-weight="400" text-anchor="start">Accessibility</text><text x="368" y="579" font-size="12.5" font-weight="400" text-anchor="end">Not used</text><rect x="12" y="583" width="356" height="0.8"/><text x="12" y="596" font-size="12.5" font-weight="400" text-anchor="start">Screen Recording (video)</text><text x="368" y="596" font-size="12.5" font-weight="400" text-anchor="end">Not used</text><rect x="12" y="600" width="356" height="0.8"/><text x="12" y="613" font-size="12.5" font-weight="400" text-anchor="start">Apple Events</text><text x="368" y="613" font-size="12.5" font-weight="400" text-anchor="end">Alert volume only</text><rect x="12" y="617" width="356" height="0.8"/><text x="12" y="630" font-size="12.5" font-weight="400" text-anchor="start">Notifications</text><text x="368" y="630" font-size="12.5" font-weight="400" text-anchor="end">Not used</text><rect x="12" y="634" width="356" height="0.8"/><text x="12" y="647" font-size="12.5" font-weight="400" text-anchor="start">Network access</text><text x="368" y="647" font-size="12.5" font-weight="400" text-anchor="end">Internet (3 call sites)</text><rect x="12" y="651" width="356" height="0.8"/><text x="12" y="664" font-size="12.5" font-weight="400" text-anchor="start">Data collected / telemetry</text><text x="368" y="664" font-size="12.5" font-weight="400" text-anchor="end">None</text><rect x="12" y="668" width="356" height="0.8"/><text x="12" y="681" font-size="12.5" font-weight="400" text-anchor="start">Audio recorded or uploaded</text><text x="368" y="681" font-size="12.5" font-weight="400" text-anchor="end">Never</text><rect x="12" y="685" width="356" height="0.8"/><text x="12" y="698" font-size="12.5" font-weight="400" text-anchor="start">Files read</text><text x="368" y="698" font-size="12.5" font-weight="400" text-anchor="end">Prefs, sync folder (if on)</text><rect x="12" y="702" width="356" height="0.8"/><text x="12" y="715" font-size="12.5" font-weight="400" text-anchor="start">Files written</text><text x="368" y="715" font-size="12.5" font-weight="400" text-anchor="end">Prefs, AutoEQ cache, sync file</text><rect x="12" y="719" width="356" height="0.8"/><text x="12" y="732" font-size="12.5" font-weight="400" text-anchor="start">System settings changed</text><text x="368" y="732" font-size="12.5" font-weight="400" text-anchor="end">Only when you change them</text><rect x="12" y="736" width="356" height="0.8"/><text x="12" y="749" font-size="12.5" font-weight="400" text-anchor="start">Entitlements</text><text x="368" y="749" font-size="12.5" font-weight="400" text-anchor="end">0</text><rect x="12" y="753" width="356" height="0.8"/><text x="12" y="766" font-size="12.5" font-weight="400" text-anchor="start">App Sandbox</text><text x="368" y="766" font-size="12.5" font-weight="400" text-anchor="end">No (system-wide audio tap)</text><rect x="12" y="770" width="356" height="0.8"/><text x="12" y="783" font-size="12.5" font-weight="400" text-anchor="start">Hardened runtime</text><text x="368" y="783" font-size="12.5" font-weight="400" text-anchor="end">No</text><rect x="12" y="787" width="356" height="0.8"/><text x="12" y="800" font-size="12.5" font-weight="400" text-anchor="start">Code signature</text><text x="368" y="800" font-size="12.5" font-weight="400" text-anchor="end">Ad-hoc</text><rect x="12" y="807" width="356" height="5"/><text x="12" y="826" font-size="14" font-weight="900" text-anchor="start">Performance</text><text x="368" y="826" font-size="10.5" font-weight="700" text-anchor="end">measured</text><rect x="12" y="830" width="356" height="0.8"/><text x="12" y="843" font-size="12.5" font-weight="800" text-anchor="start">CPU while idle</text><text x="368" y="843" font-size="12.5" font-weight="800" text-anchor="end">3.00%</text><rect x="12" y="847" width="356" height="0.8"/><text x="12" y="860" font-size="12.5" font-weight="800" text-anchor="start">Memory while idle</text><text x="368" y="860" font-size="12.5" font-weight="800" text-anchor="end">113 MB</text><rect x="12" y="864" width="356" height="0.8"/><text x="12" y="877" font-size="12.5" font-weight="400" text-anchor="start">Threads while idle</text><text x="368" y="877" font-size="12.5" font-weight="400" text-anchor="end">7</text><rect x="12" y="881" width="356" height="0.8"/><text x="12" y="894" font-size="12.5" font-weight="800" text-anchor="start">DSP per 10 ms buffer (all on)</text><text x="368" y="894" font-size="12.5" font-weight="800" text-anchor="end">0.038 ms median</text><rect x="12" y="898" width="356" height="0.8"/><text x="26" y="911" font-size="12.5" font-weight="400" text-anchor="start">(480 frames, 20 filters, 2000 runs)</text><text x="368" y="911" font-size="12.5" font-weight="400" text-anchor="end">0.043 ms p95</text><rect x="12" y="915" width="356" height="0.8"/><text x="12" y="928" font-size="12.5" font-weight="400" text-anchor="start">Base chain (optional features off)</text><text x="368" y="928" font-size="12.5" font-weight="400" text-anchor="end">0.024 ms median</text><rect x="12" y="932" width="356" height="0.8"/><text x="12" y="945" font-size="12.5" font-weight="400" text-anchor="start">Real-time load, everything on</text><text x="368" y="945" font-size="12.5" font-weight="400" text-anchor="end">0.38% of one core</text><rect x="12" y="949" width="356" height="0.8"/><text x="12" y="962" font-size="12.5" font-weight="400" text-anchor="start">Background work</text><text x="368" y="962" font-size="12.5" font-weight="400" text-anchor="end">Audio thread while on; 1 s meters</text><rect x="12" y="969" width="356" height="5"/><text x="12" y="988" font-size="14" font-weight="900" text-anchor="start">Compatibility</text><rect x="12" y="992" width="356" height="0.8"/><text x="12" y="1005" font-size="12.5" font-weight="800" text-anchor="start">macOS</text><text x="368" y="1005" font-size="12.5" font-weight="800" text-anchor="end">14.2 Sonoma or later</text><rect x="12" y="1009" width="356" height="0.8"/><text x="12" y="1022" font-size="12.5" font-weight="400" text-anchor="start">Chips</text><text x="368" y="1022" font-size="12.5" font-weight="400" text-anchor="end">Apple silicon</text><rect x="12" y="1026" width="356" height="0.8"/><text x="12" y="1039" font-size="12.5" font-weight="400" text-anchor="start">Outputs</text><text x="368" y="1039" font-size="12.5" font-weight="400" text-anchor="end">Any Core Audio device, incl. DACs</text><rect x="12" y="1043" width="356" height="0.8"/><text x="12" y="1056" font-size="12.5" font-weight="400" text-anchor="start">Headphone data</text><text x="368" y="1056" font-size="12.5" font-weight="400" text-anchor="end">AutoEQ (~8,850 models)</text><rect x="12" y="1063" width="356" height="10"/><text x="12" y="1088.5" font-size="10.5"><tspan font-weight="800">INGREDIENTS:</tspan> Swift, AVFoundation, AppKit, AudioToolbox,</text><text x="12" y="1102.0" font-size="10.5" font-weight="400" text-anchor="start">CoreAudio, CoreGraphics, Darwin, ImageIO, ObjectiveC,</text><text x="12" y="1115.5" font-size="10.5" font-weight="400" text-anchor="start">ServiceManagement, SwiftUI, UniformTypeIdentifiers, os.</text><text x="12" y="1133.0" font-size="10.5"><tspan font-weight="800">CONTAINS:</tspan> 4 private API symbols from HearingUtilities,</text><text x="12" y="1146.5" font-size="10.5" font-weight="400" text-anchor="start">PersonalAudio. Captures all system audio through a Core Audio</text><text x="12" y="1160.0" font-size="10.5" font-weight="400" text-anchor="start">process tap and processes it on your Mac. Nothing is recorded</text><text x="12" y="1173.5" font-size="10.5" font-weight="400" text-anchor="start">or sent anywhere. Background Sounds and Headphone</text><text x="12" y="1187.0" font-size="10.5" font-weight="400" text-anchor="start">Accommodations controls use private macOS settings classes,</text><text x="12" y="1200.5" font-size="10.5" font-weight="400" text-anchor="start">which may change in future macOS versions.</text><text x="12" y="1219.0" font-size="9.5" font-weight="400" text-anchor="start">Network: AutoEQ on GitHub when you use Add by Name; an update feed</text><text x="12" y="1231.5" font-size="9.5" font-weight="400" text-anchor="start">once a day only if you turn it on.</text><text x="12" y="1244.0" font-size="9.5" font-weight="400" text-anchor="start">Idle figures sampled with the equalizer on and the audio tap running.</text><text x="12" y="1256.5" font-size="9.5" font-weight="400" text-anchor="start">DSP benchmark: Sony WH-1000XM3 correction + Electronic preset, 48 kHz,</text><text x="12" y="1269.0" font-size="9.5" font-weight="400" text-anchor="start">release build.</text><text x="12" y="1283.5" font-size="9.5" font-weight="400" text-anchor="start">Measured 2026-11-04 on Apple M5, macOS 27.0.1.</text></svg>
